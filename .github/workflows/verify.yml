name: Verify Docs Site

# Builds the portal against the arda-be catalog (the source of truth) on every
# PR and push. On main a separate `deploy` job then ships the built `out/` to
# Cloudflare Workers (docs.arda.io.vn), so a Cloudflare failure never turns the
# required `verify` check red. Deploying happens here rather than in Cloudflare
# Workers Builds because the build needs a checkout of arda-be next to this repo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout arda-docs-site
        uses: actions/checkout@v4
        with:
          path: arda-docs-site

      - name: Checkout arda-be (catalog source of truth)
        uses: actions/checkout@v4
        with:
          repository: arda-labs/arda-be
          path: arda-be

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: arda-docs-site
        run: bun install --frozen-lockfile

      - name: Build docs site & emit catalog contracts
        working-directory: arda-docs-site
        env:
          ARDA_BE_PATH: ${{ github.workspace }}/arda-be
        run: bun run build

      - name: Verify contract invariants
        working-directory: arda-docs-site
        run: bun run test

      - name: Typecheck
        working-directory: arda-docs-site
        run: bun run types:check

      - name: Upload built site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-site-out
          path: arda-docs-site/out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Deploys of main queue up and never cancel halfway.
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout arda-docs-site
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: docs-site-out
          path: out

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable on this repository to deploy."
            exit 1
          fi
          bunx wrangler deploy -c cloudflare/wrangler.jsonc
