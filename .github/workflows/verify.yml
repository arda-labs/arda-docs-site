name: Verify Docs Site

# Builds the portal against the arda-be catalog (the source of truth) on every
# PR and push, and on main also deploys it to Cloudflare Workers
# (docs.arda.io.vn). Deploying happens here rather than in Cloudflare Workers
# Builds because the build needs a checkout of arda-be next to this repo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PRs verify in parallel; deploys of main queue up and never cancel halfway.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'docs-deploy' || format('verify-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout arda-docs-site
        uses: actions/checkout@v4
        with:
          path: arda-docs-site

      - name: Checkout arda-be (catalog source of truth)
        uses: actions/checkout@v4
        with:
          repository: arda-labs/arda-be
          path: arda-be

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: arda-docs-site
        run: bun install --frozen-lockfile

      - name: Build docs site & emit catalog contracts
        working-directory: arda-docs-site
        env:
          ARDA_BE_PATH: ${{ github.workspace }}/arda-be
        run: bun run build

      - name: Verify contract invariants
        working-directory: arda-docs-site
        run: bun run test

      - name: Typecheck
        working-directory: arda-docs-site
        run: bun run types:check

      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: arda-docs-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable on this repository to deploy."
            exit 1
          fi
          bunx wrangler deploy -c cloudflare/wrangler.jsonc
